# 妻社 VIP解锁 - Quantumult X 配置
#
# 用法（二选一）：
#   1) 推荐：把下面 [rewrite_local] 和 [mitm] 两段，手动合并到你的
#      Quantumult X 主配置文件（配置-配置文件-编辑）对应区块里。
#   2) 或通过 [rewrite_remote] 引入，但 [mitm] 段仍需在主配置手动配置！
#
# ⚠️ 注意：Quantumult X 的 rewrite_remote 订阅不会加载 [mitm] hostname，
#   所以 hostname 必须写进主配置，否则无法解密、脚本不生效。
#
# 生效前提：
#   - 已安装并「完全信任」MITM 证书
#     iOS: 设置→通用→VPN与设备管理 安装证书；
#          设置→通用→关于本机→证书信任设置 打开完全信任
#   - Quantumult X 设置→MITM 已开启 HTTPS 解密
#   - 确保 qsh5.qsh526724.com 这类 .com 域名在解密范围内

[rewrite_local]
# 妻社 VIP：命中 config.init / config.userInit / 帖子列表 / 帖子详情 / 板块 / 用户信息 等接口
^https?:\/\/qsh\d+\.qsh\d+\.\w+\.(?:com|cn|org\.cn)\/(?:source\/plugin\/qsts_app\/index\.php|mserver)\/ url script-response-body https://raw.githubusercontent.com/89996462/Quantumult-X/main/ghs/qs.js

[mitm]
# 手动配置 hostname（必须写在主配置，不能只靠订阅）
hostname = qsh*.qsh*.com, qsh*.qsh*.cn, qsh*.qsh*.org.cn
